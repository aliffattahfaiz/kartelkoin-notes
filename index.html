<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KartelKoin Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1 class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="13.5" stroke="url(#coinGradient)" stroke-width="2.5"/>
            <text x="14" y="19" text-anchor="middle" font-family="Archivo Black, sans-serif" font-size="14" font-weight="800" fill="url(#coinGradient)">K</text>
            <defs>
              <linearGradient id="coinGradient" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#F5B800"/>
                <stop offset="50%" stop-color="#FFD700"/>
                <stop offset="100%" stop-color="#B8860B"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        KartelKoin Notes
      </h1>
    </header>

    <main class="main-content">
      <section class="composer-section">
        <form id="composer-form" class="composer-form" aria-label="Create new note">
          <div class="composer-header">
            <input type="text" id="note-title" class="note-title-input" placeholder="Title (optional, max 120 chars)" aria-label="Note title" maxlength="120">
          </div>
          <textarea
            id="note-editor"
            class="note-editor"
            placeholder="Write a note... (max 10,000 characters)"
            aria-label="Note content"
            spellcheck="true"
            maxlength="10000"
          ></textarea>
          <div class="composer-footer">
            <span id="char-count" class="char-count">0 characters</span>
            <div class="composer-buttons">
              <button type="button" id="new-btn" class="btn btn-secondary btn-sm">New</button>
              <button type="submit" id="post-btn" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Save
              </button>
            </div>
          </div>
        </form>
        <div id="error-banner" class="error-banner hidden" role="alert"></div>
      </section>

      <section class="notes-board-section">
        <div class="notes-board-header">
          <h2>All Notes</h2>
          <div class="board-header-actions">
            <span id="notes-count" class="notes-count">0 notes</span>
            <button type="button" id="copy-all-btn" class="note-icon-btn copy-all-btn" aria-label="Copy all notes" title="Copy all notes">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>
        <div id="notes-grid" class="notes-grid" role="list"></div>
        <div id="loading-state" class="loading-state hidden" aria-live="polite">
          <div class="spinner"></div>
          <span>Loading notes...</span>
        </div>
        <div id="empty-state" class="empty-state hidden">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <p>No notes yet</p>
          <span>Be the first to post!</span>
        </div>
      </section>
    </main>
  </div>

  <script src="lz-string.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
