<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>KartelKoin Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lock-screen" class="lock">
  <form id="lock-form" class="lock-card" autocomplete="off">
    <div class="lock-mark" aria-hidden="true">K</div>
    <h1>KartelKoin Notes</h1>
    <p class="lock-sub">This notebook is private. Enter the access key to continue.</p>
    <label class="field">
      <span class="field-label">Access key</span>
      <input id="lock-key" type="password" name="key" spellcheck="false" autocapitalize="off" autocomplete="current-password" required>
    </label>
    <label class="check">
      <input id="lock-remember" type="checkbox">
      <span>Remember on this device</span>
    </label>
    <p id="lock-error" class="lock-error" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary" id="lock-submit">Unlock</button>
    <p class="lock-foot">The key is checked on the server. Nothing is stored in this page.</p>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">K</span>
      <span class="brand-name">KartelKoin Notes</span>
    </div>
    <div class="topbar-actions">
      <span id="sync-state" class="sync" role="status" aria-live="polite">Ready</span>
      <button type="button" class="btn btn-quiet" id="refresh-btn" title="Reload notes (R)">Refresh</button>
      <button type="button" class="btn btn-quiet" id="copy-all-btn" title="Copy every note as Markdown">Copy all</button>
      <button type="button" class="btn btn-quiet" id="lock-btn" title="Forget the key on this device">Lock</button>
    </div>
  </header>

  <div class="shell">
    <aside class="rail" id="rail" aria-label="Notes">
      <div class="rail-head">
        <div class="search">
          <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" spellcheck="false">
          <kbd>⌘K</kbd>
        </div>
        <button type="button" class="btn btn-primary btn-new" id="new-btn">New note</button>
      </div>
      <div class="rail-meta">
        <span id="notes-count">0 notes</span>
        <span id="filter-note" hidden></span>
      </div>
      <div id="note-list" class="note-list" role="listbox" aria-label="Note list" tabindex="0"></div>
      <p id="list-empty" class="list-empty" hidden>No notes match.</p>
    </aside>

    <main class="editor-pane" aria-label="Editor">
      <button type="button" class="btn btn-quiet back-btn" id="back-btn">All notes</button>

      <div class="editor-head">
        <input id="note-title" class="title-input" type="text" placeholder="Untitled" maxlength="120" aria-label="Note title" spellcheck="false">
        <div class="editor-actions">
          <span id="dirty-flag" class="dirty" hidden>Unsaved</span>
          <button type="button" class="btn btn-quiet" id="copy-note-btn" title="Copy this note">Copy</button>
          <button type="button" class="btn btn-danger" id="delete-btn" title="Delete this note">Delete</button>
          <button type="submit" form="editor-form" class="btn btn-primary" id="save-btn">Save</button>
        </div>
      </div>

      <form id="editor-form" class="editor-body">
        <textarea id="note-editor" class="editor" placeholder="Start writing…" maxlength="10000" spellcheck="true" aria-label="Note body"></textarea>
      </form>

      <footer class="editor-foot">
        <span id="char-count">0 / 10,000</span>
        <span id="saved-at"></span>
        <span class="foot-hint"><kbd>⌘S</kbd> save <kbd>⌘⏎</kbd> save &amp; new</span>
      </footer>
    </main>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div id="confirm" class="confirm" hidden>
  <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Delete this note?</h2>
    <p id="confirm-body" class="confirm-body"></p>
    <div class="confirm-actions">
      <button type="button" class="btn btn-quiet" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
