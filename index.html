<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KartelKoin Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1 class="logo">KartelKoin Notes</h1>
      <div class="header-actions">
        <button id="copy-link-btn" class="btn btn-primary" aria-label="Copy shareable link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy Link
        </button>
        <button id="new-note-btn" class="btn btn-secondary" aria-label="Create new note">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New
        </button>
      </div>
    </header>

    <div id="shared-banner" class="shared-banner hidden" role="alert">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span>Viewing shared note — <button id="save-shared-btn" class="banner-btn">Save to keep it</button></span>
    </div>

    <main class="main-content">
      <section class="editor-section">
        <div class="editor-header">
          <input type="text" id="note-title" class="note-title-input" placeholder="Untitled note" aria-label="Note title">
          <div class="editor-meta">
            <span id="char-count" class="char-count">0 characters</span>
            <span id="url-indicator" class="url-indicator" aria-live="polite"></span>
          </div>
        </div>
        <textarea
          id="note-editor"
          class="note-editor"
          placeholder="Start typing your note... (Markdown supported)"
          aria-label="Note content"
          spellcheck="true"
        ></textarea>
        <div class="editor-footer">
          <span class="shortcut-hint">Ctrl+S to save • Ctrl+Enter for new note</span>
        </div>
      </section>

      <aside class="sidebar" aria-label="Saved notes">
        <div class="sidebar-header">
          <h2>Saved Notes</h2>
          <button id="clear-history-btn" class="btn btn-ghost" aria-label="Clear all saved notes">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
        <ul id="notes-list" class="notes-list" role="list"></ul>
        <div id="empty-state" class="empty-state hidden">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <p>No saved notes yet</p>
          <span>Start typing to create your first note</span>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js" integrity="sha512-rO1RGIvc27NJasn7PS6R5r0JgFKuMVD6X5YDTfYcT16LP2LDrfVflCp6rR59pJZ9R+L3f+Hz9g6R5bBqN1wEw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js"></script>
</body>
</html>
